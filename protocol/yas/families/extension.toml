  { name = "MAX_ARGS", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_ARGUMENT_BYTES", tag = 3, type = "u64", required = true, hard_min = 1, hard_max = 1048576 },
  { name = "MAX_OBJECT_BYTES", tag = 4, type = "u64", required = true, hard_min = 1, hard_max = 67108864 },
  { name = "MAX_OUTPUT_RECORD_BYTES", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 1048576 },
  { name = "MAX_COMMAND_DESCRIPTOR_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 65536 },
  { name = "MAX_COMMAND_RECORDS", tag = 7, type = "u32", required = true, hard_min = 1, hard_max = 32 },
  { name = "MAX_DEFINITIONS", tag = 8, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_OBJECT_STAGES_PER_SESSION", tag = 9, type = "u32", required = true, hard_min = 1, hard_max = 8 },
  { name = "MAX_FOLLOWS_PER_SESSION", tag = 10, type = "u32", required = true, hard_min = 1, hard_max = 128 },
  { name = "MAX_RUNNING_ATTEMPTS", tag = 11, type = "u32", required = true, hard_min = 1, hard_max = 32 },
  { name = "MAX_MEMORY_BYTES", tag = 12, type = "u64", required = true, hard_min = 1, hard_max = 134217728 },
  { name = "MAX_JOB_BYTES", tag = 13, type = "u64", required = true, hard_min = 1, hard_max = 67108864 },
  { name = "MAX_MUTATION_REPLAYS", tag = 14, type = "u32", required = true, hard_min = 1, hard_max = 65536 },
]

