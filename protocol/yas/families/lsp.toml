schema = 1
family = "yas.lsp"

limits = [
  { name = "MAX_WORKSPACES_PER_SESSION", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 64 },
  { name = "MAX_WATCHES_PER_WORKSPACE", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 32 },
  { name = "MAX_QUERY_RECORDS", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_QUERY_BYTES", tag = 4, type = "u32", required = true, hard_min = 1, hard_max = 4194304 },
  { name = "MAX_CURSOR_BYTES", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_INLINE_BUFFER_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_BUFFER_BYTES", tag = 7, type = "u64", required = true, hard_min = 1, hard_max = 67108864 },
  { name = "MAX_BUFFERS_PER_WORKSPACE", tag = 8, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_STAGES_PER_SESSION", tag = 9, type = "u32", required = true, hard_min = 1, hard_max = 16 },
  { name = "MAX_DIAGNOSTICS_PER_FILE", tag = 10, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_SERVERS", tag = 11, type = "u32", required = true, hard_min = 1, hard_max = 256 },
  { name = "MAX_CONCURRENT_QUERIES", tag = 12, type = "u32", required = true, hard_min = 1, hard_max = 8 },
]

[[request]]
name = "OPEN"
kind = 0x0000
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "source:bytes_u32 containing WorkspaceSource,open_mode:u8,reserved:u8=0,diagnostics_settle_ms:u16,language:string_u16,profile:string_u16,initialization_options:bytes_u32,Extensions; EXPLICIT requires nonempty language/profile and permits initialization options; AUTO_DISCOVER requires all three empty and may start multiple backends; ResultPrefix + workspace_handle:u64,workspace_revision:u64,position_encoding:u8,reserved:u8=0,backend_count:u16,capabilities:u64,canonical_root:bytes_u32 raw platform bytes,Extensions; backend_count zero requires OPEN_NO_BACKEND_DETAIL_EXTENSION"
[[request]]
name = "CLOSE"
kind = 0x0001
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "workspace_handle:u64,Extensions; ResultPrefix; idempotent and releases workspace-scoped watches"
[[request]]
name = "WATCH"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "workspace_handle:u64,datasets:u16,reserved:u16=0,state:bytes_u32 containing StateWatch; ResultPrefix + StateWatchResult"
[[request]]
name = "UNWATCH"
kind = 0x0003
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "subscription_id:u32; ResultPrefix"
[[request]]
name = "QUERY"
kind = 0x0004
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "workspace_handle:u64,max_records:u16,reserved:u16=0,cursor:bytes_u16,initial_receive_credit:u64,body:bytes_u32 containing QueryBody,Extensions; ResultPrefix + QueryPage"
[[request]]
name = "BUFFER_PUT"
kind = 0x0005
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "workspace_handle:u64,operation_id:[u8;16],expected_revision:u64,path:bytes_u32 containing FS WirePath,content:bytes_u32 containing valid UTF-8 document text,Extensions; expected revision zero requires absent overlay; ResultPrefix + BufferIdentity"
[[request]]
name = "BUFFER_BEGIN"
kind = 0x0006
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "workspace_handle:u64,expected_revision:u64,path:bytes_u32 containing FS WirePath,byte_len:u64,content_hash:[u8;32],initial_send_credit:u64,Extensions; ResultPrefix + staging_handle:u64,descriptor:bytes_u32 containing sensitive receiver-to-sender BYTE TransferDescriptor with required upload-stage extension naming that handle,Extensions; staged bytes must be valid UTF-8 document text when BUFFER_COMMIT validates them; before BUFFER_COMMIT succeeds, RESET of the returned descriptor discards the stage"
[[request]]
name = "BUFFER_COMMIT"
kind = 0x0007
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "staging_handle:u64,operation_id:[u8;16],Extensions; validates exact size, hash, and UTF-8 before publishing; ResultPrefix + BufferIdentity"
[[request]]
name = "BUFFER_CLOSE"
kind = 0x0008
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "buffer_handle:u64,expected_revision:u64,operation_id:[u8;16],Extensions; ResultPrefix"
[[request]]
name = "LIST_SERVERS"
kind = 0x0009
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
# Semantic clarification without a wire-layout change: zero is daemon-wide;
# foreign roots use workspace_handle zero only in the returned ServerList.
layout = "workspace_handle:u64,Extensions; zero workspace lists all session-visible servers; ResultPrefix + ServerList"
[[request]]
name = "STOP_SERVER"
kind = 0x000a
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
# Handles/generations are opaque nonzero boot-scoped values. An unknown handle
# is NOT_FOUND; a generation mismatch for a live handle is STALE.
layout = "server_handle:u64,generation:u64,operation_id:[u8;16],Extensions; ResultPrefix; idempotent by operation ID"

[[event]]
name = "STATE"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "StateEvent<StateEntity|EntityPatch|RemovedEntity>; entities are BACKEND, DIAGNOSTICS, and BUFFER"
[[event]]
name = "STATE_ACK"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateAck"
[[event]]
name = "CLOSED"
kind = 0x0002
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "workspace_handle:u64,reason:u8,reserved:[u8;3]=0,detail:string_u32; reason is CLIENT_REQUEST,ROOT_GONE,PERMISSION_LOST,BACKEND_FAILED,or RESOURCE_LIMIT; connection loss is a local client lifecycle reason, not a wire Event"

[[type]]
name = "workspace_source"
layout = "kind:u8,reserved:[u8;3]=0; FS root_handle:u64,root_path:bytes_u32 containing FS WirePath; PLATFORM_PATH path:bytes_u32 raw nonempty platform bytes; TERMINAL_CWD terminal_handle:u64,suffix:bytes_u32 containing relative FS WirePath resolved atomically from that terminal's live cwd"
[[type]]
name = "open_no_backend_detail_extension"
layout = "OPEN Result extension tag 1; required value is detail:string_u32, nonempty UTF-8 explaining why auto-discovery found no backend; present iff backend_count is zero"

[[type]]
name = "position"
layout = "line:u32,byte_column:u32; zero-based UTF-8 byte column, never UTF-16 code units"
[[type]]
name = "text_range"
layout = "start:Position,end_exclusive:Position; lexicographically ordered"
[[type]]
name = "document_target"
layout = "path:bytes_u32 containing non-root FS WirePath,document_revision:u64,content_hash:[u8;32] BLAKE3-256; zero revision selects disk, where an all-zero request hash means snapshot current bytes atomically at admission and a nonzero hash is an exact precondition; nonzero revision selects that overlay revision and requires a nonzero exact hash; every result record carries the actual selected hash"
[[type]]
name = "query_body"
# WORKSPACE_SYMBOLS deliberately permits an empty query, meaning list all.
layout = "kind:u16,flags:u16=0,variant body; DEFINITION target+position; REFERENCES target+position+query_flags:u16+reserved:u16; HOVER target+position; DOCUMENT_SYMBOLS target; WORKSPACE_SYMBOLS query:string_u16; COMPLETION target+position+trigger_kind:u8+reserved:[u8;3]+trigger:string_u16; CODE_ACTIONS target+range+diagnostic_count:u16+reserved:u16+ids:u64; FORMATTING target+range_present:u8+reserved:[u8;3]+optional range+tab_width:u16+format_flags:u16; RENAME target+position+new_name:string_u16; SIGNATURE_HELP target+position"
[[type]]
name = "typed_query_record"
layout = "record_len:u32,record_kind:u16,record_flags:u16,body; length includes kind and flags; flag bit0 REQUIRED; known records are LOCATION,HOVER,SYMBOL,COMPLETION,ACTION,EDIT,SIGNATURE; unknown optional records are skipped and unknown required records fail"
[[type]]
name = "query_page"
layout = "query_status:u16,page_flags:u16,detail:string_u32,next_cursor:bytes_u16,total_hint:u64,delivery:u8,reserved:[u8;3]=0; query_status uses Core status codes, non-OK requires INCOMPLETE and nonempty detail, OK requires empty detail; TRUNCATED iff next_cursor is nonempty; INLINE record_count:u16,reserved:u16=0,record_stream:bytes_u32; TRANSFER descriptor:bytes_u32 containing sensitive server-to-client MESSAGE TransferDescriptor; Extensions; a Core non-OK Result still has no body"
[[type]]
name = "location_record"
layout = "path:bytes_u32 containing non-root FS WirePath,document_revision:u64,content_hash:[u8;32] BLAKE3-256,range:TextRange,flags:u16,reserved:u16=0"
[[type]]
name = "hover_record"
layout = "target:bytes_u32 containing LocationRecord,markup_kind:u8,reserved:[u8;3]=0,content:bytes_u32; target supplies exact path/hash/revision/range"
[[type]]
name = "symbol_record"
layout = "symbol_kind:u16,flags:u16,depth:u16,reserved:u16=0,name:string_u16,detail:string_u16,path:bytes_u32 empty or FS WirePath,content_hash_present:u8,reserved:[u8;3]=0,optional content_hash:[u8;32] required exactly when path is present,range:TextRange,selection_range:TextRange"
[[type]]
name = "completion_record"
layout = "item_kind:u16,flags:u16,label:string_u16,detail:string_u16,filter_text:string_u16,insert_text:bytes_u32,replacement_range_present:u8,reserved:[u8;3]=0,optional replacement_range:TextRange"
[[type]]
name = "edit_record"
layout = "path:bytes_u32 containing non-root FS WirePath,expected_revision:u64,expected_content_hash:[u8;32] BLAKE3-256,range:TextRange,replacement:bytes_u32; both revision and hash are checked atomically"
[[type]]
name = "action_record"
layout = "title:string_u16,kind:string_u16,flags:u16,edit_count:u16,repeated edit:bytes_u32 containing EditRecord,disabled_reason:string_u32; v1 actions carry edits and never an opaque server command"
[[type]]
name = "signature_record"
layout = "flags:u16,active_parameter:u16,param_start:u32,param_end:u32,label:string_u16,documentation:string_u32; active_parameter 0xffff means none and requires zero parameter bounds, otherwise bounds are UTF-8 byte offsets within label; ACTIVE marks the selected overload"
[[type]]
name = "buffer_identity"
layout = "buffer_handle:u64,buffer_revision:u64,workspace_revision:u64,byte_len:u64,content_hash:[u8;32],Extensions"
[[type]]
name = "server_record"
# workspace_handle may be zero only in a daemon-wide ServerList record whose
# root is foreign to the session; BACKEND StateEntity requires it nonzero.
layout = "server_handle:u64,generation:u64,server_revision:u64,workspace_handle:u64,phase:u8,progress_pct:u8,reserved:u16=0,epoch:u32,refused_edits:u32,reserved:u32=0,rss_bytes:u64,capabilities:u64,language:string_u16,profile:string_u16,backend_id:string_u16,last_message:string_u32,Extensions; progress is 0..100 or 255 UNKNOWN; phases are SPAWNING,INITIALIZING,INDEXING,READY,FAILED and stopped servers are removed"
[[type]]
name = "server_list"
layout = "server_count:u16,reserved:u16=0,repeated server:bytes_u32 containing ServerRecord"
[[type]]
name = "diagnostic"
layout = "diagnostic_id:u64,severity:u8,reserved:u8=0,tags:u16,range:TextRange,code:string_u16,source:string_u16,message:string_u32"
[[type]]
name = "diagnostic_record"
layout = "path:bytes_u32 containing non-root FS WirePath,document_revision:u64,content_hash:[u8;32] BLAKE3-256,diagnostics_revision:u64,count:u16,reserved:u16=0,repeated diagnostic:bytes_u32,Extensions; a zero count explicitly clears the path and the hash still identifies the diagnosed bytes"
[[type]]
name = "buffer_record"
layout = "workspace_handle:u64,buffer_handle:u64,buffer_revision:u64,path:bytes_u32 containing FS WirePath,byte_len:u64,content_hash:[u8;32],Extensions"
[[type]]
name = "state_entity"
layout = "entity_kind:u16,reserved:u16=0,body:bytes_u32 containing complete ServerRecord,DiagnosticRecord,or BufferRecord; ADD and REPLACE carry the complete entity"
[[type]]
name = "entity_patch"
layout = "entity_kind:u16,reserved:u16=0,observed_revision:u64,replacement:bytes_u32 containing complete StateEntity,Extensions"
[[type]]
name = "removed_entity"
layout = "entity_kind:u16,reserved:u16=0,key:bytes_u32 containing exact kind-specific key,removed_revision:u64; BACKEND key is BackendRemoveKey, DIAGNOSTICS key is DiagnosticsRemoveKey, BUFFER key is BufferRemoveKey"
[[type]]
name = "backend_remove_key"
layout = "server_handle:u64; nonzero"
[[type]]
name = "diagnostics_remove_key"
layout = "the raw encoding of one non-root FS WirePath (component_count:u16,repeated component:bytes_u16), wrapped once by RemovedEntity key:bytes_u32"
[[type]]
name = "buffer_remove_key"
layout = "buffer_handle:u64; nonzero"
[[type]]
name = "family_limits"
layout = "ordered optional extensions: tags 1..12 encode max workspaces/session:u32,watches/workspace:u32,query records:u32,query bytes:u32,cursor bytes:u32,inline buffer bytes:u32,buffer bytes:u64,buffers/workspace:u32,stages/session:u32,diagnostics/file:u32,servers:u32,concurrent queries:u32"

