schema = 1
family = "yas.env"

limits = [
  { name = "MAX_KEY_BYTES", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_VALUE_BYTES", tag = 2, type = "u32", required = true, hard_min = 0, hard_max = 1048576 },
  { name = "MAX_ENTRIES", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 8192 },
  { name = "MAX_TOTAL_DATA_BYTES", tag = 4, type = "u64", required = true, hard_min = 1, hard_max = 4194304 },
  { name = "MAX_INLINE_BYTES", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_BATCH_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 1052686 },
]

[[constant]]
name = "DELIVERY_INLINE"
value = 0

[[constant]]
name = "DELIVERY_TRANSFER"
value = 1

[[constant]]
name = "SNAPSHOT_CONTENT_KIND"
value = 0

[[constant]]
name = "MAX_KEY_BYTES"
value = 4096

[[constant]]
name = "MAX_VALUE_BYTES"
value = 1048576

[[constant]]
name = "MAX_ENTRIES"
value = 8192

[[constant]]
name = "MAX_TOTAL_DATA_BYTES"
value = 4194304

[[constant]]
name = "MAX_INLINE_BYTES"
value = 32768

# Eight bytes of batch header plus one maximum-size encoded entry.
[[constant]]
name = "MAX_BATCH_BYTES"
value = 1052686

[[constant]]
name = "LIMIT_MAX_KEY_BYTES"
value = 1

[[constant]]
name = "LIMIT_MAX_VALUE_BYTES"
value = 2

[[constant]]
name = "LIMIT_MAX_ENTRIES"
value = 3

[[constant]]
name = "LIMIT_MAX_TOTAL_DATA_BYTES"
value = 4

[[constant]]
name = "LIMIT_MAX_INLINE_BYTES"
value = 5

[[constant]]
name = "LIMIT_MAX_BATCH_BYTES"
value = 6

[[request]]
name = "GET"
kind = 0x0000
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "initial_receive_credit:u64,Extensions; ResultPrefix + GetResult"

[[type]]
name = "entry"
layout = "key:bytes_u16,value:bytes_u32; key nonempty, strictly ascending raw bytes, neither field contains NUL"

[[type]]
name = "get_result"
layout = "delivery:u8,reserved:[u8;3]=0,entry_count:u32,total_data_bytes:u64; INLINE repeated Entry, TRANSFER descriptor:bytes_u32 containing sensitive MESSAGE TransferDescriptor; Extensions"

[[type]]
name = "snapshot_batch"
layout = "first_index:u32,entry_count:u16,reserved:u16=0,repeated Entry; batches nonempty and contiguous"

[[type]]
name = "family_limits"
layout = "extension tags 1 max_key_bytes:u32,2 max_value_bytes:u32,3 max_entries:u32,4 max_total_data_bytes:u64,5 max_inline_bytes:u32,6 max_batch_bytes:u32"
