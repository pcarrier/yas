schema = 1
family = "yas.desktop"

limits = [
  { name = "MAX_TRAY_ITEMS", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_NOTIFICATIONS", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_MENU_NODES", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_NOTIFICATION_ACTIONS", tag = 4, type = "u32", required = true, hard_min = 1, hard_max = 256 },
  { name = "MAX_INLINE_MENU_BYTES", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_INLINE_ASSET_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
]

[[request]]
name = "WATCH"
kind = 0x0000
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateWatch; optional extension tag 1 contains datasets:u8 (bit0 tray, bit1 notifications), absent defaults to both; ResultPrefix + StateWatchResult"
[[request]]
name = "UNWATCH"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "subscription_id:u32; ResultPrefix"
[[request]]
name = "GET_MENU"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "tray_handle:u64,tray_revision:u64,menu_revision:u64,initial_receive_credit:u64,Extensions; ResultPrefix + InlineOrTransfer"
[[request]]
name = "TRAY_ACTION"
kind = 0x0003
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "tray_handle:u64,tray_revision:u64,menu_revision:u64,operation_id:[u8;16],action_kind:u8,flags:u8,reserved:u16=0,value:i32,item_handle:u64,Extensions; ResultPrefix; MENU_ITEM requires nonzero menu_revision and item_handle; all other kinds require both zero; only SCROLL accepts flags/value and value is nonzero"
[[request]]
name = "NOTIFICATION_ACTION"
kind = 0x0004
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "notification_handle:u64,revision:u64,action_kind:u8,reserved:[u8;3]=0,action_handle:u64,operation_id:[u8;16],reply:string_u32,Extensions; ResultPrefix; action_handle is nonzero iff ACTION and reply is valid only for ACTION"
[[request]]
name = "FETCH_ASSET"
kind = 0x0005
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "content_hash:[u8;32],initial_receive_credit:u64,Extensions; ResultPrefix + InlineOrTransfer"

[[event]]
name = "STATE"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "StateEvent<DesktopRecord>"
[[event]]
name = "STATE_ACK"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateAck"

