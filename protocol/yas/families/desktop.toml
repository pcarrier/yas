[[type]]
name = "tray_record"
layout = "tray_handle:u64,revision:u64,menu_revision:u64,status:u8,reserved:[u8;3]=0,title:string_u16,icon_hash:[u8;32],Extensions"
[[type]]
name = "notification_record"
layout = "notification_handle:u64,revision:u64,flags:u16,urgency:u8,reserved:u8=0,expires_server_ns:u64,application:string_u16,summary:string_u16,body:string_u32,action_count:u16,repeated action_handle:u64,label:string_u16,Extensions; extension tag 1 content_image_hash:[u8;32], tag 2 application_icon_hash:[u8;32], tag 3 notification_progress, tag 4 notification_reply; HAS_PROGRESS/HAS_REPLY flags are set iff their extensions are present"
[[type]]
name = "state_entity_body"
layout = "entity_kind:u16,reserved:u16=0; ADD/REPLACE complete tray_record or notification_record; PATCH entity handle:u64,revision:u64,Extensions, with notification tags 1..4 using their complete codecs and a zero-byte value clearing that field; REMOVE tray handle:u64,revision:u64; REMOVE notification handle:u64,revision:u64,close_reason:u8,reserved:[u8;3]=0"
[[type]]
name = "notification_progress"
layout = "value:u32,maximum:u32; maximum is nonzero and value <= maximum"
[[type]]
name = "notification_reply"
layout = "placeholder:string_u16"
[[type]]
name = "notification_close_reason"
layout = "u8: EXPIRED=1, DISMISSED=2, CLOSED_BY_CALLER=3, UNDEFINED=4"
[[type]]
name = "watch_datasets"
layout = "StateWatch extension tag 1 value datasets:u8 where bit0 tray, bit1 notifications; absent defaults to both"
[[type]]
name = "menu_tree"
layout = "tray_handle:u64,tray_revision:u64,menu_revision:u64,node_count:u32,repeated node:bytes_u32,Extensions; nodes preorder and parent-before-child"
[[type]]
name = "menu_node"
layout = "node_handle:u64,parent_handle:u64,kind:u8,flags:u8,reserved:u16=0,position:u32,action_handle:u64,label:string_u16,shortcut:string_u16,icon_hash:[u8;32],Extensions"
[[type]]
name = "family_limits"
layout = "ordered optional extensions: tags 1..6 encode max tray items:u32,notifications:u32,menu nodes:u32,notification actions:u32,inline menu bytes:u32,inline asset bytes:u32; all tags are present in a selected family descriptor"
