[[event]]
name = "INPUT"
kind = 0x0011
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "ViewFeedback,data:remaining"
[[event]]
name = "MOUSE"
kind = 0x0012
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "ViewFeedback,client_monotonic_ns:u64,action:u8,button:u8,modifiers:u16,column:i32,row:i32"
[[event]]
name = "WHEEL"
kind = 0x0013
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "ViewFeedback,client_monotonic_ns:u64,source:u8,reserved:[u8;3]=0,dx_32_32:i64,dy_32_32:i64"
[[event]]
name = "WHEEL_AT"
kind = 0x0014
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "ViewFeedback,client_monotonic_ns:u64,source:u8,reserved:[u8;3]=0,dx_32_32:i64,dy_32_32:i64,column:i32,row:i32"
[[event]]
name = "FRAME"
kind = 0x0020
direction = "server_to_client"
sensitive = "required"
compression = "forbidden"
datagram = "forbidden"
layout = "view_id:u32,frame_sequence:u32,frame_flags:u16,optional base_sequence:u32,grid_payload:remaining"
[[event]]
name = "FRAME_CHUNK"
kind = 0x0021
direction = "server_to_client"
sensitive = "required"
compression = "forbidden"
datagram = "forbidden"
layout = "view_id:u32,frame_sequence:u32,chunk_index:u16,chunk_count:u16,logical_frame_len:u32,chunk:remaining"
[[event]]
name = "FRAME_ACK"
kind = 0x0022
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "ViewFeedback"

