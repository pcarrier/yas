schema = 1
family = "yas.terminal"

limits = [
  { name = "MAX_TERMINALS_PER_SESSION", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 65535 },
  { name = "MAX_VIEWS_PER_SESSION", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_VIEW_ROWS", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_VIEW_COLS", tag = 4, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_INPUT_BYTES", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 16384 },
  { name = "MAX_INLINE_QUERY_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_QUERY_RECORDS", tag = 7, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_HYPERLINK_URI_BYTES", tag = 8, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
]

[[request]]
name = "WATCH"
kind = 0x0000
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateWatch; ResultPrefix + StateWatchResult"
[[request]]
name = "UNWATCH"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "subscription_id:u32; ResultPrefix"
[[request]]
name = "CREATE"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "rows:u16,cols:u16,reserved:u32=0,operation_id:[u8;16],launch:bytes_u32,Extensions; ResultPrefix + CreateResult"
[[request]]
name = "RESTART"
kind = 0x0003
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,operation_id:[u8;16],launch_mode:u8,cutover_mode:u8,reserved:u16=0,optional launch:bytes_u32,Extensions; ResultPrefix + RestartResult"
[[request]]
name = "SIGNAL"
kind = 0x0004
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,operation_id:[u8;16],signal:u16,reserved:u16=0,Extensions; ResultPrefix"
[[request]]
name = "CLOSE"
kind = 0x0005
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,operation_id:[u8;16]; ResultPrefix"
[[request]]
name = "SET_DEADLINE"
kind = 0x0006
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,operation_id:[u8;16],mode:u8,reserved:[u8;7]=0,duration_ns:u64; ResultPrefix"
[[request]]
name = "RESIZE"
kind = 0x0007
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,rows:u16,cols:u16; ResultPrefix + state_revision:u64"
[[request]]
name = "SET_FOCUS"
kind = 0x0008
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,focused:u8,reserved:[u8;3]=0; ResultPrefix"
[[request]]
name = "SCROLL"
kind = 0x0009
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,mode:u8,reserved:[u8;7]=0,amount:i64; ResultPrefix + applied_offset:i64"
[[request]]
name = "OPEN_VIEW"
kind = 0x000a
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,rows:u16,cols:u16,max_fps:u16,codec_count:u8,reserved:u8=0,repeated codec_version:u16,Extensions; ResultPrefix + OpenViewResult"
[[request]]
name = "CONFIGURE_VIEW"
kind = 0x000b
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,Extensions; ResultPrefix"
[[request]]
name = "RESET_VIEW"
kind = 0x000c
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32; ResultPrefix"
[[request]]
name = "READ"
kind = 0x000d
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,cursor_kind:u8,representation:u8,flags:u16=0,cursor_a:u64,cursor_b:u32,max_bytes:u32,initial_receive_credit:u64,Extensions; ABSOLUTE a=start oldest-relative row,b=max rows (zero through end); TAIL a=rows skipped from one-past-tail,b=max rows (zero through oldest); ResultPrefix + QueryBody"
[[request]]
name = "SEARCH"
kind = 0x000e
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,flags:u16,reserved:u16=0,start_cursor:QueryCursor kind SEARCH_CURSOR_POSITION with a=oldest-relative row,b=column,max_results:u32,query:bytes_u32,initial_receive_credit:u64,Extensions; BACKWARD reverses traversal; result coordinates and next cursor are oldest-relative and end-exclusive; ResultPrefix + QueryBody"
[[request]]
name = "CWD"
kind = 0x000f
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,reserved:u32=0,initial_receive_credit:u64,Extensions; ResultPrefix + QueryBody"
[[request]]
name = "JOURNAL"
kind = 0x0010
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,flags:u16,limit:u16,from_index:u64,initial_receive_credit:u64,Extensions; without TAIL from_index is an absolute command index; with TAIL it is records skipped back from next_index; ResultPrefix + QueryBody"
[[request]]
name = "OUTPUT"
kind = 0x0011
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,cursor_kind:u8,flags:u8=0,reserved:u16=0,cursor_a:u64,cursor_b:u32,max_bytes:u32,initial_receive_credit:u64,Extensions; COMMAND a=index,b=column; LATEST_COMMAND a=0,b=column; SEQUENCE and PROBE a=sequence,b=column; ResultPrefix + QueryBody"
[[request]]
name = "WAIT"
kind = 0x0012
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,wait_kind:u8,flags:u8=0,reserved:u16=0,cursor_a:u64,cursor_b:u32,max_bytes:u32,timeout_ns:u64,needle:bytes_u32,initial_receive_credit:u64,Extensions; OUTPUT uses a=sequence,b=column and nonempty needle and returns OutputResult; COMMAND uses a=index,b=0 and empty needle; LATEST_COMMAND uses a=b=0 and empty needle; command waits return one-record JournalResult; ResultPrefix + QueryBody"
[[request]]
name = "COPY_RANGE"
kind = 0x0013
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "terminal_handle:u64,generation:u32,representation:u8,reserved:[u8;3]=0,start_row:i64,start_col:u32,end_row:i64,end_col:u32,max_bytes:u32,initial_receive_credit:u64,Extensions; rows are inclusive oldest-retained coordinates with negative values relative to one-past-tail, end_col is exclusive; ResultPrefix + QueryBody"
[[request]]
name = "CLOSE_VIEW"
kind = 0x0014
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32; ResultPrefix"
[[request]]
name = "SEARCH_CATALOG"
kind = 0x0015
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "max_results:u32 in 1..=MAX_QUERY_RECORDS,query:string_u32 UTF-8 <= MAX_CATALOG_SEARCH_QUERY_BYTES,Extensions; server trims query and performs a case-insensitive regex search across every terminal title, visible grid, and scrollback; invalid or empty regex returns no entries; ResultPrefix + CatalogSearchResult"

[[event]]
name = "STATE"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
