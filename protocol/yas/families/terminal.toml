[[type]]
name = "terminal_state_record"
layout = "terminal_handle:u64,lifecycle:u8,reserved:u8=0,rows:u16,cols:u16,generation:u32,used_rows:u32,Extensions"
[[type]]
name = "launch"
layout = "command_kind:u8,cwd_kind:u8,environment_base:u8,reserved:u8=0,command_variant,cwd_variant,environment_count:u16,repeated key:bytes_u16,entry_kind:u8,value:bytes_u32,Extensions"
[[type]]
name = "create_result"
layout = "terminal_handle:u64,state_revision:u64,generation:u32,reserved:u32=0,Extensions"
[[type]]
name = "restart_result"
layout = "state_revision:u64,generation:u32,reserved:u32=0"
[[type]]
name = "open_view_result"
layout = "view_id:u32,codec_version:u16,max_inflight_frames:u8,reserved:u8=0,max_encoded_frame:u32,max_decoded_frame:u32,first_sequence:u32,Extensions"
[[type]]
name = "initial_view_request"
layout = "rows:u16,cols:u16,max_fps:u16,codec_count:u8,reserved:u8=0,repeated codec_version:u16,Extensions"
[[type]]
name = "view_feedback"
layout = "view_id:u32,presented_sequence:u32,decoder_queue_depth:u8,available_frame_slots:u8"
[[type]]
name = "presentation_metrics"
layout = "viewport_width_px:u32,viewport_height_px:u32,cell_width_16_16:u32,cell_height_16_16:u32,device_scale_16_16:u32"
[[type]]
name = "exit_record"
layout = "kind:u8,reason:u8,reserved:u16=0,code:i32,detail:string_u32"
[[type]]
name = "search_results"
layout = "count:u32,repeated start_row:u64,start_col:u32,end_row:u64,end_col:u32,preview:string_u32; rows are oldest-retained and ranges end-exclusive"
[[type]]
name = "catalog_search"
layout = "max_results:u32 in 1..=MAX_QUERY_RECORDS,query:string_u32 UTF-8 <= MAX_CATALOG_SEARCH_QUERY_BYTES,Extensions"
[[type]]
name = "catalog_search_entry"
layout = "terminal_handle:u64,generation:u32,score:u32,primary_source:u8,matched_sources:u8,reserved:u16=0,scroll_offset:u64 where 0 means no scrollback jump,context:string_u32 UTF-8 <= MAX_CATALOG_SEARCH_CONTEXT_BYTES; matched_sources uses CATALOG_SEARCH_MATCH_MASK and contains primary source bit"
[[type]]
name = "catalog_search_result"
layout = "flags:u16 CATALOG_SEARCH_RESULT_FLAGS,reserved:u16=0,count:u32 <= MAX_QUERY_RECORDS,repeated CatalogSearchEntry,Extensions; entries rank score descending, the requester's lead terminal first on a tie, then terminal_handle ascending; a deterministic prefix is returned and TRUNCATED is set when max_results or the peer frame limit omits later entries"
[[type]]
name = "journal_result"
layout = "oldest_index:u64,next_index:u64,count:u32,repeated index:u64,generation:u32,flags:u16,reserved:u16=0,exit_code:i32,start_seq:u64,end_seq:u64,started_unix_ms:u64,ended_unix_ms:u64,command:string_u32"
[[type]]
name = "output_result"
layout = "generation:u32,flags:u16,reserved:u16=0,start_seq:u64,start_col:u32,next_seq:u64,next_col:u32,text:bytes_u32"
[[type]]
name = "styled_lines"
layout = "line_count:u32,repeated row:i64,start_col:u32,cell_count:u32,cells:[u8;12]*cell_count,overflow_count:u32,repeated cell_offset:u32,text:string_u32,hyperlink_count:u32,repeated start_col:u32,cell_count:u32,uri:string_u16; line start_col and hyperlink columns are original absolute columns"
[[type]]
name = "query_body"
layout = "delivery:u8,content_kind:u8,encoding:u8,reserved:u8=0,flags:u16,reserved:u16=0,Extensions tags 1 inline_bytes,2 sensitive TransferDescriptor,3 next_cursor,4 total_lines:u64,5 satisfying_state_revision:u64; content kind fixes encoding and next-cursor layout"
[[type]]
name = "query_cursor"
layout = "kind:u8,a:u64,b:u32; READ/OUTPUT next cursor preserves the request cursor kind and exact next coordinate"
[[type]]
name = "query_next_cursor"
layout = "CONTENT_TEXT/STYLED_LINES/TEXT_AND_STYLED uses QueryCursor with READ kind; CONTENT_SEARCH_RESULTS uses QueryCursor kind SEARCH_CURSOR_POSITION with a=oldest-relative row,b=column; CONTENT_OUTPUT always uses QueryCursor kind OUTPUT_CURSOR_SEQUENCE with a=next_seq,b=next_col (COMMAND/LATEST_COMMAND/PROBE normalize and SEQUENCE preserves); CONTENT_JOURNAL is next absolute command index:u64; CONTENT_PATH has no cursor"
[[type]]
name = "text_and_styled"
layout = "plain:bytes_u32 UTF-8,styled:bytes_u32 containing StyledLines"
[[type]]
name = "family_limits"
layout = "ordered optional extensions: tags 1..8 encode max terminals/session:u32,views/session:u32,view rows:u32,view columns:u32,input bytes:u32,inline query bytes:u32,query records:u32,hyperlink URI bytes:u32; all tags are present in a selected family descriptor"
