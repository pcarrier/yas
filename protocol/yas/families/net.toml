[[request]]
name = "OPEN"
kind = 0x0000
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "operation_id:[u8;16],address:bytes_u32 containing NetAddress,delivery_preference:u8,drop_policy:u8,reserved:u16=0,initial_receive_credit:u64,early_data:bytes_u32,tls_options:bytes_u32 containing zero or TlsOptions,Extensions; ResultPrefix + NetEndpoint"

[[request]]
name = "CLOSE"
kind = 0x0001
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "flow_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix"

[[event]]
name = "DATAGRAM"
kind = 0x0000
direction = "bidirectional"
sensitive = "required"
compression = "forbidden"
datagram = "net_native_flow"
layout = "flow_handle:u64,sequence:u64,payload:remaining"

[[event]]
name = "DATAGRAM_STATS"
kind = 0x0001
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "flow_handle:u64,revision:u64,flags:u16,reserved:u16=0,client_to_peer_delivered:u64,peer_to_client_delivered:u64,client_oversized_drops:u64,peer_oversized_drops:u64,client_congestive_drops:u64,peer_congestive_drops:u64,transport_errors:u64,Extensions"

[[type]]
name = "net_address"
layout = "kind:u8,reserved:[u8;3]=0; TCP/UDP host:string_u16,port:u16,reserved:u16=0; Unix kind:u8,reserved:[u8;3]=0,name:bytes_u32; Windows pipe requested_mode:u8,reserved:[u8;3]=0,name:string_u16"

[[type]]
name = "tls_options"
layout = "verification:u8,reserved:[u8;3]=0,sni:string_u16,alpn_count:u16,reserved:u16=0,repeated protocol:bytes_u16,Extensions"

[[type]]
name = "net_endpoint"
layout = "flow_handle:u64,mode:u8,direction:u8,selected_delivery:u8,reserved:u8=0,max_datagram_payload:u32,server_instance_limit:u32,max_message_bytes:u64,local_address:bytes_u32 containing zero or NetAddress,peer_address:bytes_u32 containing NetAddress,negotiated_alpn:bytes_u16,descriptor:bytes_u32 containing zero or sensitive bidirectional TransferDescriptor,Extensions"

[[type]]
name = "family_limits"
layout = "extension tags 1 max_host_bytes:u32,2 max_local_address_bytes:u32,3 max_pipe_name_bytes:u32,4 max_alpn_protocols:u32,5 max_alpn_bytes:u32,6 max_early_data_bytes:u32,7 max_flows_per_session:u32,8 max_pending_opens:u32,9 max_buffered_per_flow:u64,10 max_datagram_payload:u32,11 max_datagram_queue:u32,12 connect_timeout_ns:u64"
