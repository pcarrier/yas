[[type]]
name = "media_format"
layout = "codec:u16,channels:u16,sample_rate:u32,width:u32,height:u32,frame_rate_milli:u32,Extensions"
[[type]]
name = "device_record"
layout = "device_handle:u64,revision:u64,kind:u8,state:u8,flags:u16,name:string_u16,format_count:u16,repeated MediaFormat,Extensions"
[[type]]
name = "lease_record"
layout = "lease_handle:u64,revision:u64,device_handle:u64,owner_session:[u8;16],lifecycle:u8,reserved:[u8;7]=0,expires_server_ns:u64,Extensions"
[[type]]
name = "portal_record"
layout = "portal_handle:u64,revision:u64,kind:u16,state:u16,owner_session:[u8;16],metadata:bytes_u32 containing PortalRecordMetadata,Extensions; PENDING contains request metadata, GRANTED contains PortalGrantedMetadata, DENIED/CANCELLED/WITHDRAWN require empty metadata"
[[type]]
name = "portal_choice_value"
layout = "id:string_u16,value:string_u16; IDs and values are nonempty UTF-8 without NUL"
[[type]]
name = "portal_choice"
layout = "id:string_u16,label:string_u16,initial:string_u16,option_count:u16,reserved:u16=0,repeated option:bytes_u32 containing PortalChoiceValue; option IDs are unique and nonempty initial names one option"
[[type]]
name = "portal_access_request_metadata"
layout = "deadline_server_ns:u64,parent_surface_handle:u64 (zero means absent),app_id:string_u16,title:string_u16,subtitle:string_u16,body:string_u32,deny_label:string_u16,grant_label:string_u16,icon_name:string_u16,choice_count:u16,reserved:u16=0,repeated choice:bytes_u32 containing PortalChoice"
[[type]]
name = "portal_screencast_candidate"
layout = "surface_handle:u64,width:u32,height:u32,title:string_u16,app_id:string_u16,thumbnail_hash_present:u8,reserved:[u8;3]=0,optional thumbnail_hash:[u8;32]; thumbnail bytes are fetched through FETCH_ASSET"
[[type]]
name = "portal_screencast_request_metadata"
layout = "deadline_server_ns:u64,parent_surface_handle:u64 (zero means absent),app_id:string_u16,multiple:u8,reserved:[u8;3]=0,candidate_count:u16,reserved:u16=0,repeated candidate:bytes_u32 containing PortalScreenCastCandidate"
[[type]]
name = "portal_access_grant_metadata"
layout = "choice_count:u16,reserved:u16=0,repeated chosen:bytes_u32 containing PortalChoiceValue; IDs are unique"
[[type]]
name = "portal_screencast_grant_metadata"
layout = "surface_count:u16,reserved:u16=0,repeated surface_handle:u64; handles are nonzero and unique"
[[type]]
name = "portal_screencast_granted_stream"
layout = "surface_handle:u64,stream_handle:u64; both nonzero; surface and stream handles are unique within one grant"
[[type]]
name = "portal_screencast_granted_metadata"
layout = "stream_count:u16,reserved:u16=0,repeated PortalScreenCastGrantedStream; these are the live streams released by PORTAL_CLOSE"
[[type]]
name = "portal_reply_metadata"
layout = "GRANT ACCESS uses PortalAccessGrantMetadata; GRANT SCREENCAST uses PortalScreenCastGrantMetadata; DENY and CANCEL are exactly zero bytes"
[[type]]
name = "portal_granted_metadata"
layout = "GRANTED ACCESS uses PortalAccessGrantMetadata; GRANTED SCREENCAST uses PortalScreenCastGrantedMetadata with allocated stream handles"
[[type]]
name = "portal_record_metadata"
layout = "PENDING uses kind-specific request metadata; GRANTED uses PortalGrantedMetadata; DENIED, CANCELLED, and WITHDRAWN are exactly zero bytes"
[[type]]
name = "player_record"
layout = "player_handle:u64,revision:u64,state:u16,flags:u16,position_us:i64,duration_us:i64,identity:string_u16,desktop_entry:string_u16,title:string_u16,artist:string_u16,album:string_u16,Extensions"
[[type]]
name = "state_entity_body"
layout = "entity_kind:u16,reserved:u16=0; ADD/REPLACE complete device_record,lease_record,portal_record,or player_record; PATCH entity handle:u64,revision:u64,Extensions; REMOVE entity handle:u64,revision:u64"
[[type]]
name = "asset_delivery"
layout = "InlineOrTransfer with Desktop-like content-addressed asset; inline at most 32768, Transfer family Media kind 1 version 1"
[[type]]
name = "family_limits"
layout = "ordered optional extensions: tags 1..14 encode max devices:u32,leases/session:u32,streams/session:u32,portals/session:u32,players:u32,formats:u32,inline metadata bytes:u32,inline asset bytes:u32,portal metadata bytes:u32,portal string bytes:u32,portal body bytes:u32,portal choices:u32,portal choice options:u32,screencast candidates:u32; all tags are present in a selected family descriptor"
