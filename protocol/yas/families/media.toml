schema = 1
family = "yas.media"

limits = [
  { name = "MAX_DEVICES", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 256 },
  { name = "MAX_LEASES_PER_SESSION", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 64 },
  { name = "MAX_STREAMS_PER_SESSION", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 256 },
  { name = "MAX_PORTALS_PER_SESSION", tag = 4, type = "u32", required = true, hard_min = 1, hard_max = 64 },
  { name = "MAX_PLAYERS", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_FORMATS", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 64 },
  { name = "MAX_INLINE_METADATA_BYTES", tag = 7, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_INLINE_ASSET_BYTES", tag = 8, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_PORTAL_METADATA_BYTES", tag = 9, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_PORTAL_STRING_BYTES", tag = 10, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_PORTAL_BODY_BYTES", tag = 11, type = "u32", required = true, hard_min = 1, hard_max = 16384 },
  { name = "MAX_PORTAL_CHOICES", tag = 12, type = "u32", required = true, hard_min = 1, hard_max = 16 },
  { name = "MAX_PORTAL_CHOICE_OPTIONS", tag = 13, type = "u32", required = true, hard_min = 1, hard_max = 16 },
  { name = "MAX_SCREENCAST_CANDIDATES", tag = 14, type = "u32", required = true, hard_min = 1, hard_max = 64 },
]

[[request]]
name = "WATCH"
kind = 0x0000
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateWatch; ResultPrefix + StateWatchResult"
[[request]]
name = "UNWATCH"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "subscription_id:u32; ResultPrefix"
[[request]]
name = "OPEN_OUTPUT"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "device_handle:u64,format_count:u16,reserved:u16=0,repeated MediaFormat,latency_target_ns:u64,target_bitrate_kbps:u16,reserved:u16=0,Extensions; target_bitrate_kbps is 0 for server default or 1..=MAX_OUTPUT_BITRATE_KBPS; ResultPrefix + stream_handle:u64,selected_format:MediaFormat"
[[request]]
name = "ACQUIRE_DEVICE"
kind = 0x0003
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "device_handle:u64,operation_id:[u8;16],kind:u8,reserved:[u8;3]=0,lease_duration_ns:u64,format_count:u16,repeated MediaFormat,Extensions; ResultPrefix + lease_handle:u64,stream_handle:u64,expires_server_ns:u64,selected_format:MediaFormat"
[[request]]
name = "RELEASE_DEVICE"
kind = 0x0004
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "lease_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix"
[[request]]
name = "PORTAL_REPLY"
kind = 0x0005
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "portal_handle:u64,revision:u64,operation_id:[u8;16],kind:u16,decision:u8,reserved:u8=0,metadata:bytes_u32 containing kind/decision-specific PortalReplyMetadata,Extensions; ResultPrefix; DENY and CANCEL require empty metadata"
[[request]]
name = "PLAYER_ACTION"
kind = 0x0006
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "player_handle:u64,operation_id:[u8;16],action:u16,reserved:u16=0,value:i64,Extensions; ResultPrefix"
[[request]]
name = "CLOSE_STREAM"
kind = 0x0007
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "stream_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix"
[[request]]
name = "FETCH_ASSET"
kind = 0x0008
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "content_hash:[u8;32],initial_receive_credit:u64,Extensions; ResultPrefix + InlineOrTransfer"
[[request]]
name = "PORTAL_CLOSE"
kind = 0x0009
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "portal_handle:u64,revision:u64,operation_id:[u8;16],Extensions; ResultPrefix; idempotent by operation_id; closes pending or granted portal and releases every granted stream"

[[event]]
name = "STATE"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "StateEvent<MediaRecord>"
[[event]]
name = "STATE_ACK"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateAck"
[[event]]
name = "PORTAL_REQUEST"
kind = 0x0010
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "portal_handle:u64,revision:u64,kind:u16,flags:u16,application_handle:u64,metadata:bytes_u32 containing kind-specific PortalRequestMetadata,Extensions"
[[event]]
name = "FRAME"
kind = 0x0020
direction = "bidirectional"
sensitive = "required"
compression = "forbidden"
datagram = "media_frame"
layout = "stream_handle:u64,sequence:u64,capture_time:u64,presentation_time:u64,codec_version:u16,flags:u16,fragment_index:u16,fragment_count:u16,complete_len:u32,payload:remaining; audio capture_time and nonzero presentation_time are sample positions at the selected MediaFormat.sample_rate from the server media-session epoch, while video values are nanoseconds from that same epoch; presentation_time 0 means use capture_time"
[[event]]
name = "FRAME_ACK"
kind = 0x0021
direction = "bidirectional"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "stream_handle:u64,consumed_sequence:u64,queue_depth:u16,desired_credit_frames:u16"
[[event]]
name = "STREAM_STATUS"
kind = 0x0022
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "stream_handle:u64,revision:u64,status:u16,flags:u16,codec_config:bytes_u32,Extensions"

